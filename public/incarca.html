<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Încarcă Excel</title>
<style>
  :root { color-scheme: dark; }
  body { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; background: #0d0d0d; color: #f0efec; font: 1.1rem/1.5 "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
  p, li { color: #c3c2b7; }
  form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: 1.5rem 0; padding: 1rem; background: #1a1a19; border-radius: .5rem; }
  input { flex: 1 1 16rem; min-width: 0; font: inherit; color: inherit; }
  button { padding: .5rem 1.25rem; background: #3987e5; color: #fff; border: 0; border-radius: .3rem; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #rezultat { padding: 1rem; background: #1a1a19; border-left: .3rem solid #989690; border-radius: .3rem; }
  #rezultat[hidden] { display: none; }
  #rezultat.bun { border-color: #0ca30c; }
  #rezultat.rau { border-color: #d03b3b; }
  #rezultat strong { display: block; color: #f0efec; }
  #rezultat ul { margin: .5rem 0 0; padding-left: 1.2rem; }
  a { color: #7fb2f0; }
</style>
</head>
<body>
<h1>Încarcă Excelul pe panou</h1>
<p>Merge centralizatorul lunar de expirări sau fișierul de atelier, cu foile Flota și In lucru. Fișierul înlocuiește versiunea anterioară de același tip, iar televizorul îl preia în cel mult un minut.</p>

<form id="formular">
  <input type="file" id="fisier" accept=".xlsx" required>
  <button id="trimite">Încarcă</button>
</form>

<div id="rezultat" role="status" hidden></div>

<p><a href="/">Înapoi la panou</a></p>

<script>
  const form = document.getElementById('formular');
  const button = document.getElementById('trimite');
  const result = document.getElementById('rezultat');

  function show(ok, title, details) {
    result.hidden = false;
    result.className = ok ? 'bun' : 'rau';
    result.textContent = '';
    const strong = document.createElement('strong');
    strong.textContent = title;
    result.appendChild(strong);
    if (!details.length) return;
    const list = document.createElement('ul');
    for (const text of details) {
      const item = document.createElement('li');
      item.textContent = text;
      list.appendChild(item);
    }
    result.appendChild(list);
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    try {
      const response = await fetch('/api/incarca', {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: document.getElementById('fisier').files[0],
      });
      const data = await response.json();
      if (response.ok) show(true, `Încărcat: ${data.summary}`, data.notes);
      else show(false, data.error, []);
    } catch (err) {
      show(false, 'Nu am putut trimite fișierul. Verifică legătura la internet.', []);
    }
    button.disabled = false;
  });
</script>
</body>
</html>
